policy:
  Active: balloons
  ReservedResources:
    CPU: 1
  balloons:
    AllocatorTopologyBalancing: true
    PreferManyCores: true
    BalloonTypes:
      - Name: policydefaults
        MinCPUs: 2
        MinBalloons: 2
      - Name: topo1cores0
        MinCPUs: 2
        MinBalloons: 2
        PreferManyCores: false
      - Name: topo0cores1
        AllocatorTopologyBalancing: false
        PreferManyCores: true
      - Name: topo0cores0
        AllocatorTopologyBalancing: false
        PreferManyCores: false
      - Name: topo1cores1
        AllocatorTopologyBalancing: true
        PreferManyCores: true
instrumentation:
  HTTPEndpoint: :8891
  PrometheusExport: true
logger:
  Debug: policy
  Klog:
    skip_headers: true
